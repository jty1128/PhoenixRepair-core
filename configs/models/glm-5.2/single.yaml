# One independent sample per task. Change output for sample-2/sample-3.
model: glm-5.2
instances: null  # Set a manifest path here, with --instances, or INSTANCES in .env.
runtime: null    # Set a runtime path here, with --runtime, or PHOENIX_RUNTIME.
output: runs/glm-5.2-single
concurrency: 4
max_steps: 200
max_output_tokens: 8192  # Original GLM single/TTS generation profile.
task_timeout: null  # Profile default: GLM/Qwen 7200 seconds; Kimi 3000.
api_base: null      # API_BASE in .env, otherwise DashScope OpenAI-compatible.
